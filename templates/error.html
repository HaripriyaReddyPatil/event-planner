{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card center">
        <div class="error-code">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="button primary" href="{{ url_for('home') }}">Back to events</a>
    </div>
</section>
{% endblock %}
