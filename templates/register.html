{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="eyebrow dark">Get started</div>
        <h1>Create an account</h1>
        <p>Create events, join others, save favorites, and manage attendance.</p>

        <form method="POST" class="form-stack">
            <label>Full name</label>
            <input type="text" name="name" required placeholder="Your name">

            <label>Email</label>
            <input type="email" name="email" required placeholder="you@example.com">

            <label>Password</label>
            <input type="password" name="password" minlength="6" required placeholder="At least 6 characters">

            <button class="button primary full" type="submit">Create account</button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
